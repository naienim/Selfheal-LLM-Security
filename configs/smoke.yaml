extends: base.yaml
name: smoke
mitigations:
  hardened_system_prompt:
    enabled: true
  input_filter:
    enabled: true
    regex:
      injection: true
      jailbreak: true
    classifier:
      enabled: true
      threshold: 0.9
  output_filter:
    enabled: true
    policy:
      enabled: true
    toxicity:
      enabled: true
      threshold: 0.5
garak:
  prompt_cap: 2
  categories:
    prompt_injection:
      generations: 1
      probes: [promptinject.HijackHateHumans]
    jailbreak:
      generations: 1
      probes: [dan.Dan_11_0]
    toxicity:
      generations: 1
      probes: [lmrc.Bullying]
benign:
  limit: 5